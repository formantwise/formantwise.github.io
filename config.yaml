colors:
  cursor: '#ff0000'
  cursorWidth: 1
  selection:
    fill: 'rgba(255, 192, 203, 0.4)'
    border: '#ff0080'

  waveform:
    background: '#ffffff'
    line: '#000000'
    lineWidth: 1

  pitch: '#0000ff'
  pitchWidth: 2

  intensity: '#008000'
  intensityWidth: 2

  formant:
    f1: '#ff0000'
    f2: '#ff8080'
    f3: '#ff4040'
    f4: '#ffc0c0'
    size: 3

  tier:
    background: '#f5f5f5'
    selected: '#dcdcff'
    border: '#808080'
    text: '#000000'

  boundary: '#0000ff'
  boundaryHover: '#ff0000'
  boundaryWidth: 2

formantPresets:
  female:
    maxFormant: 5500
    numFormants: 5
  male:
    maxFormant: 5000
    numFormants: 5
  child:
    maxFormant: 8000
    numFormants: 5

spectrogram:
  dynamicRange: 70.0     # dB below the loudest point that still shows (Praat: 70)
  preEmphasis: 6.0       # dB/octave boost above 1 kHz, as Praat (0 = off)

pitch:
  displayFloor: 75
  displayCeiling: 500

annotation:
  defaultTiers:
    - words
    - phones
